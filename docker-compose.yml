services:
  jenkins:
    container_name: jenkins
    build: . 
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock  #Bind volume: attaching the docker socket inside the jenkins container, to allow the container if having a docker client to be able to execute docker commmands. The commmand will be executed in the host
    ports:
      - "8080:8080"

#Regular docker volume to store the data of the jenkins server
volumes:
  jenkins_home:
